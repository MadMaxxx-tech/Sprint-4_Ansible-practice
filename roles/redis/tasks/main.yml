---
# Установка Redis только на системах семейства Debian.
- name: Install Redis server
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

# Создание каталога для данных Redis.
- name: Create Redis data directory
  ansible.builtin.file:
    path: "{{ redis_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: '0750'
