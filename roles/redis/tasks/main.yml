---
# Установка Redis только на системах семейства Debian.
- name: Install Redis server
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

# Создание каталога для данных Redis.
- name: Create Redis data directory
  ansible.builtin.file:
    path: "{{ redis_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: '0750'

# Генерация конфигурации Redis из Jinja2-шаблона.
- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: '0640'
  notify:
    - Restart Redis
